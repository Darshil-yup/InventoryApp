[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # Line too long
    "E402",  # Module-level import not at top of file
    "W291",  # Trailing whitespace
    "W293",  # Blank line contains whitespace
    "I001",  # Import block formatting/sorting
    "E401",  # Multiple imports on one line (used in test pings)
    "F401",  # Unused imports (leaves clean code for showcases)
    "F541"   # f-string without placeholders
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
